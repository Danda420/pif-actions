name: Update PIF

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Pixel DEVICE codename (default: bluejay)'
        required: false
        default: 'bluejay'
        type: string

permissions:
  contents: write

jobs:
  update-pif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install apktool & xmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils wget curl

          APKTOOL_VER="2.10.0"
          sudo wget -q "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -O /usr/local/bin/apktool
          sudo wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Build updated PIF.apk & JSON
        run: |
          chmod +x ./update_pif-fp
          ./update_pif-fp "${{ github.event.inputs.device || 'bluejay' }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PIF.apk info.txt pif.json
          if ! git diff --cached --quiet; then
            git commit -m "update"
            git push -f origin main
          else
            echo "No changes to commit."
          fi